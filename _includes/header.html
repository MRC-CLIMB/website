<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="CLIMB home">
      <img class="brand-logo logo-light" src="{{ '/assets/img/climb-logo-blue.svg' | relative_url }}" alt="" width="38" height="38">
      <img class="brand-logo logo-dark" src="{{ '/assets/img/climb-logo-white.svg' | relative_url }}" alt="" width="38" height="38">
      <span class="brand-wordmark">
        <span>CLIMB</span>
        <span>{{ site.tagline }}</span>
      </span>
    </a>
    <nav class="main-nav" id="site-nav" aria-label="Primary navigation">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url or (item.url != '/' and page.url contains item.url) %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <a class="nav-cta" href="{{ site.docs_site }}" target="_blank" rel="noopener noreferrer">Documentation</a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>
