<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' | replace:'.html','' }}">
<link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/space-grotesk-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url('{{ '/assets/fonts/inter-latin.woff2' | relative_url }}') format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url('{{ '/assets/fonts/space-grotesk-latin.woff2' | relative_url }}') format('woff2')}
@font-face{font-family:'Old Standard TT';font-style:italic;font-weight:400;font-display:swap;src:url('{{ '/assets/fonts/old-standard-tt-italic-400-latin.woff2' | relative_url }}') format('woff2')}
</style>
<style>
{% include style.css %}
</style>
<link rel="alternate" type="application/rss+xml" title="{{ site.title }} News" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/climb-logo-blue.svg' | relative_url }}" type="image/svg+xml">
<script>
  (function(){try{var t=localStorage.getItem('climb-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
