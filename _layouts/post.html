---
layout: default
---
<div class="container">
  <div class="page-header">
    <p class="eyebrow">News{% if page.category %} &middot; {{ page.category }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}</p>
  </div>
  <article class="page-content prose post-content">
    {{ content }}
  </article>
  <div class="post-footer">
    <a href="{{ '/blog/' | relative_url }}">&larr; Back to News</a>
  </div>
</div>
