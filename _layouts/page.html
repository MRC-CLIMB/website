---
layout: default
---
<div class="container">
  <div class="page-header">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
  <div class="page-content prose">
    {{ content }}
  </div>
</div>
